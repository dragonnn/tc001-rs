[target.xtensa-esp32-none-elf]
runner = "./flash.sh"

[env]
ESP_LOG="info"
ESP_HAL_CONFIG_PLACE_RMT_DRIVER_IN_RAM="true"
#ESP_HAL_CONFIG_PLACE_ANON_IN_RAM="true"
#ESP_HAL_CONFIG_IMPL_CRITICAL_SECTION="false"
#ESP_RTOS_CONFIG_TICK_RATE_HZ="1"
ESP_HAL_CONFIG_MIN_CHIP_REVISION="100"

[build]
rustflags = [
  "-C", "link-arg=-nostartfiles",
  "-Z", "stack-protector=all",
]

target = "xtensa-esp32-none-elf"

[unstable]
build-std = ["alloc", "core"]
#build-std-features = ["panic_immediate_abort"]
